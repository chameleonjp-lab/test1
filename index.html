<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#101a32" />
        <meta
            name="description"
            content="3Dの床の上にある箱を方向ボタンで動かす、PlayCanvas Engineの試作品です。"
        />
        <title>箱を動かそう</title>
    </head>
    <body>
        <main id="game-shell">
            <canvas id="application" aria-label="箱を動かす3Dゲーム画面"></canvas>

            <section class="hud" aria-label="ゲーム情報">
                <div class="title-block">
                    <p class="eyebrow">3Dゲーム試作品</p>
                    <h1>箱を動かそう</h1>
                    <p id="position-readout" aria-live="polite">位置：中央</p>
                </div>
                <button id="reset-button" class="reset-button" type="button">最初に戻す</button>
            </section>

            <p class="instructions">方向ボタンを押して、箱を床の上で動かします</p>

            <nav class="controls" aria-label="箱の移動ボタン">
                <div class="direction-pad">
                    <button class="direction-button up" type="button" data-direction="up" aria-label="上へ移動">
                        上
                    </button>
                    <button class="direction-button left" type="button" data-direction="left" aria-label="左へ移動">
                        左
                    </button>
                    <button class="direction-button down" type="button" data-direction="down" aria-label="下へ移動">
                        下
                    </button>
                    <button class="direction-button right" type="button" data-direction="right" aria-label="右へ移動">
                        右
                    </button>
                </div>
            </nav>
        </main>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
